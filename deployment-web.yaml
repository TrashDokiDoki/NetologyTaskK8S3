apiVersion: apps/v1
kind: Deployment
metadata:
  name: netology-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netology-web
  template:
    metadata:
      labels:
        app: netology-web
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80

        - name: multitool
          image: wbitt/network-multitool:latest
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "11443"
          ports:
            - containerPort: 8080
